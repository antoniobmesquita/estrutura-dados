<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Palindromo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Verificar Palindromo</h1>
    </header>
    <main>
        <form id="idFormularioElemento">
            <fieldset>
                <label for="idInElemento">
                    Digite a palavra, número, frase ou conjunto de caracteres
                </label>
                <br>
                <input type="text" name="idInElemento" id="idInElemento" minlength="3" required>
                <p class="botoes">
                    <button type="submit" id="botaoEnviar">Verificar</button>
                    <button type="reset" value="" id="botaoLimpar">Limpar </button>
                </p>
            </fieldset>
        </form>
        <section id="idOutResultadoVerificacao" aria-live="polite"></section>
    </main>
    <script type="module" src="./app.js"></script>
</body>

</html>
